# =============================================================================
# run_snappi_test.sh configuration
#
# Paths are resolved relative to this file's own directory unless given as
# absolute paths. Passwords below are lab defaults (admin/admin) matching the
# containerlab SONiC default credentials - change them for a real DUT.
# =============================================================================

images:
  dir: "./images"                 # local cache of VIAVI + opensource images/artifacts
                                  # (docker images not already loaded/pulled are taken from here)

testcenter:
  version: "5.62.0766"                              # -> stc_5.62.0766.tgz, or a VIAVI zip distribution
                                                    # (Spirent_TestCenter_Docker_5.62.0766.zip) containing
                                                    # that same tgz - either is accepted under images.dir,
                                                    # the zip is auto-extracted on first use. Labserver and
                                                    # OTG service versions are derived from this, not configured
                                                    # separately: labserver expects an exact match
                                                    # (-> labserver-5.62.0766.tar.xz), OTG service only
                                                    # needs its leading major.minor to match (the "5.62"
                                                    # -> otgservice.5.62.*.sh, e.g.
                                                    # otgservice.5.62.0009-20260112080331.sh), since its
                                                    # patch/build numbering doesn't track STC's.
  license_server: "@license-server.example.com"     # REQUIRED. SPIRENTD_LICENSE_FILE value.
                                                    # Examples:
                                                    #   @license-server.company.com
                                                    #   @10.10.10.10
                                                    #   license-server.company.com:7443
                                                    #
                                                    # For licensing assistance:
                                                    # https://www.viavisolutions.com/support

# Labserver / OTG service / STC chassis. "standalone" means this tool deploys
# them on THIS host via docker run + otgctl; "docker-compose" means this tool
# deploys labserver+OTG together on THIS host via VIAVI's testcenter-otg-setup
# docker-compose stack (see VIAVI OTG Service Deployment Guide);
# "provisioned" means they already exist elsewhere and this tool only
# verifies reachability - it will never deploy or destroy them.
deployment:
  mode: docker-compose            # standalone | provisioned | docker-compose
  docker_compose:                 # only used when mode: docker-compose
                                  # Uses the testcenter-otg-setup checkout this container solution
                                  # itself ships inside (one directory up from container/) directly -
                                  # no separate clone.
    keep_build_image: true        # optional, default true. --destroy (and same-scope teardowns) will
                                  # NOT remove the OTG image built for this stack (otg:latest) - only
                                  # the labserver/otg containers are removed, so the next deploy skips
                                  # rebuilding it from the installer. Set false to also remove it on
                                  # destroy, forcing a rebuild next time. Never affects labserver images
                                  # (those are cached VIAVI artifacts, not build output).
  labserver:
    ip: "127.0.0.1"               # reachable IP of the labserver
  otg_service:
    ip: "127.0.0.1"               # reachable IP of the OTG API service. The sonic-mgmt
                                  # test runs inside a container, so 127.0.0.1/localhost
                                  # here is auto-resolved to this host's real address
                                  # (e.g. WSL2's eth0 IP) - set an explicit IP instead if
                                  # auto-detection (hostname -I) picks the wrong interface.
    port: 50051
  stc_chassis:
    ip: "192.168.1.2"             # STC chassis container mgmt IP (containerlab-assigned)

dut:
  mode: virtual                   # virtual (sonic-vs deployed via containerlab) | physical (existing hardware)
  hostname: "sonic-s6100-dut1"
  mgmt_ip: "192.168.1.3"
  hwsku: "Force10-S6000"
  iface_speed: "40000"
  total_ports: 32                 # full front-panel port count of the platform (topology port range,
                                   # independent of how many ports are actually cabled below)
  image: "vrnetlab/sonic_sonic-vs:master"  # virtual mode only
  image_archive: ""                        # virtual mode only; empty = auto-detect sonic-vs-*.tar.gz under images.dir
  build_sonic_vs: true                     # (optional, default true) virtual mode only. If dut.image is not found in
                                           # 'docker images' and no archive is found/configured, and dut.image's
                                           # repository is exactly "vrnetlab/sonic_sonic-vs", automatically build it
                                           # by downloading sonic-vs.img.gz for dut.image's tag (e.g. "master" or a
                                           # release branch like "202511") - see download_source below for where
                                           # from - and running vrnetlab's build (guide §3.3). It always builds the
                                           # tag dut.image asks for, never a different one (e.g. never fabricates
                                           # "202511" from a master build). Fails with a clear error if that tag has
                                           # no published sonic-vs.img.gz at the selected source. Set to false to
                                           # disable and always require a manually provided image/archive. An image
                                           # already present in 'docker images' is always used as-is and never
                                           # subject to any of this - including custom/manually-built tags with no
                                           # corresponding SONiC branch name.
  download_source: auto                    # auto | azure | sonic.software
                                           # auto: try Azure first, then fallback to sonic.software
                                           # Only consulted when build_sonic_vs above actually needs to download and
                                           # build an image that isn't already present locally - never applied to an
                                           # existing local image, regardless of its tag.
  keep_dut_artifacts: true                 # (optional, default true) virtual mode only. If build_sonic_vs built the
                                           # sonic-vs image at least once, --destroy (and same-scope teardowns) will
                                           # NOT remove the downloaded/built artifacts under images.dir/vrnetlab
                                           # (the vrnetlab source checkout and the extracted sonic-vs-*.qcow2) - so
                                           # the next build skips re-cloning/re-downloading. Set false to also
                                           # remove them on destroy, forcing a fresh clone/download next time. Has
                                           # no effect if build_sonic_vs never actually built the image.
  keep_dut_image: true                     # (optional, default true) virtual mode only. If build_sonic_vs built the
                                           # sonic-vs docker image at least once, --destroy (and same-scope
                                           # teardowns) will NOT remove that built image (dut.image, e.g.
                                           # vrnetlab/sonic_sonic-vs:master or vrnetlab/sonic_sonic-vs:202511) - so
                                           # the next deploy skips rebuilding it. Set false to also remove it on
                                           # destroy, forcing a rebuild next time. Has no effect if build_sonic_vs
                                           # never actually built the image.
  credentials:
    user: admin
    password: admin
  links:                          # DUT <-> STC front-panel cabling; at least 2 entries required for the smoke test
    - dut_port: Ethernet0
      stc_port: Card1/Port1
      bandwidth: 40000
      vlan_id: 1000
      host_interface: ""          # physical mode ONLY: host NIC name cabled to this STC port (e.g. enp1s0f0)
    - dut_port: Ethernet4
      stc_port: Card1/Port2
      bandwidth: 40000
      vlan_id: 1000
      host_interface: ""

otg:
  credentials:
    user: admin
    password: admin
  rest_port: 50051
  ssh_user: ""                    # optional ansible_user for the [ptf] inventory line; leave empty to omit

sonic_mgmt:
  source_dir: ""                  # empty => clone fresh under workspace/sonic-mgmt next to this config;
                                   # set to an existing checkout (e.g. wk_snappi_container_test) to reuse it as-is
  repo: "git@github.com:sonic-net/sonic-mgmt.git"
  branch: "master"
  baseline_commit: "91d8be388"    # patch is only validated against this exact commit
  patch:
    apply: true                    # explicit toggle - set false to manage the patch yourself.
                                   # Never applied automatically to a dirty existing checkout either way.
    file: "./snappi-stc-patch-v0.1.patch"
  keep_sonic_mgmt_src: true         # (optional, default false) If true, --destroy (and
                                    # cleanup.env_on_failure/replace_on_version_change teardowns)
                                    # will NOT delete a tool-owned sonic-mgmt clone (source_dir
                                    # empty) - every other tool-owned resource is still removed.
                                    # Has no effect on a user-supplied checkout (source_dir set),
                                    # which is never deleted by this tool regardless.

cleanup:
  env_on_failure: false             # After deploy-mg or the pretest/smoke test FAILS, automatically
                                    # tear down all tool-owned environment resources (labserver, OTG
                                    # service, containerlab topology, sonic-mgmt container/clone - same
                                    # scope as --destroy). A successful run always leaves the
                                    # environment deployed for reuse - this setting never touches that
                                    # case. Set to false to keep a FAILED environment around for
                                    # debugging instead. Does not apply to --deploy-only, which always
                                    # leaves the environment deployed regardless of outcome.
  replace_on_version_change: true   # (optional, default true) If a tool-owned STC chassis container
                                    # from a previous run is still deployed and testcenter.version now
                                    # names a different version, automatically tear down the whole
                                    # tool-owned environment (labserver, OTG service, containerlab
                                    # topology, sonic-mgmt container/clone - same scope as --destroy)
                                    # before deploying fresh on the new version. Set to false to instead
                                    # keep the old environment and fall back to each resource's normal
                                    # per-resource reuse check - this can leave a mix of old/new
                                    # component versions running together.

logging:
  dir: ""                           # empty = "logs" under the current working directory (where the
                                    # script is invoked from); set to override (relative paths resolve
                                    # against this file's own directory, like images.dir above)

allure:
  enabled: true                   # opt-in only; not deployed unless explicitly set to true
  host: ""                        # empty = this host's address
  ui_port: 5252
  api_port: 5050
  project_id: "snappi-smoke"

testbed:
  conf_name: "vms-snappi-sonic"
  inv_name: "snappi-sonic"
  dut_group_name: "sonic_dell64_40"
  server_group: "Server_6"

topology:
  name: "tgen_ptf32"
  dut_type: "ToRRouter"
  vlan:
    id: 1000
    prefix: "192.168.100.1/24"
    prefix_v6: "fc02:1000::1/64"
    tag: 1000
    mac: "00:aa:bb:cc:dd:ee"
